title: Suspicious PowerShell Download or Encoded Command
id: SIGMA-001
status: production
description: Detects suspicious PowerShell execution with hidden window, encoded commands, or web download strings.
level: HIGH
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process_name: powershell.exe
    command_line:
      - "-enc"
      - "downloadstring"
      - "iex"
      - "webclient"
      - "bypass"
