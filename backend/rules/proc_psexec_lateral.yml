title: PsExec Remote Service Execution and SMB Lateral Movement
id: SIGMA-006
status: production
description: Detects PsExec execution, PSEXESVC service creation, or SMB lateral traversal between internal hosts.
level: HIGH
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    command_line:
      - "psexec"
      - "psexesvc"
      - "admin$"
      - "c$"
