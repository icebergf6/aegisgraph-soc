title: Volume Shadow Copy Deletion via VSSAdmin
id: SIGMA-002
status: production
description: Detects execution of vssadmin.exe attempting to delete volume shadow copies, typical of ransomware staging.
level: CRITICAL
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process_name: vssadmin.exe
    command_line:
      - "delete shadows"
      - "/all"
      - "/quiet"
